[project]
name = "legacy-sensor"
version = "0.1.0"
description = "Legacy sauna sensor simulation for the group project"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.poetry]
# The repo is a set of scripts, not an installable package; Poetry only manages dependencies.
package-mode = false

[tool.pytest.ini_options]
testpaths = ["test_sensor.py", "tests"]
pythonpath = ["."]
markers = [
    "slow: long-running tests (deselect with -m \"not slow\")",
]
